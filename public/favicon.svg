<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The E3J mark: <E3J> — flat yellow-gold, heavy sans, oversized 3. -->
  <rect width="64" height="64" rx="10" fill="#131210"/>
  <g fill="#e8b13c">
    <polygon points="12.5,21 3.5,32 12.5,43 12.5,38 6.8,32 12.5,26"/>
    <polygon points="51.5,21 60.5,32 51.5,43 51.5,38 57.2,32 51.5,26"/>
    <text x="21" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="17">E</text>
    <text x="32.5" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="27">3</text>
    <text x="44" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="17">J</text>
